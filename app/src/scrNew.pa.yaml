      - cmpNwToast:
          Control: CanvasComponent
          ComponentName: cmpToast
          Properties:
            Show: =locToast
            Visible: =locToast
            Kind: =locToastKind
            Message: =locToastMsg
            OnDismiss: |-
              =UpdateContext({ locToast: false })
            Width: =Min(480, Parent.Width - 2 * nfSpace.Lg)
            Height: =nfSize.RowLg
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height - Self.Height - nfSpace.Xxl
      - tmrNwToast:
          Control: Timer@2.1.0
          Properties:
            Duration: =4000
            Visible: =false
            Start: =locToast
            AutoStart: =locToast
            Repeat: =false
            Reset: =true
            OnTimerEnd: |-
              =UpdateContext({ locToast: false })
      - cmpNwBusy:
          Control: CanvasComponent
          ComponentName: cmpLoadingOverlay
          Properties:
            Show: =locBusy
