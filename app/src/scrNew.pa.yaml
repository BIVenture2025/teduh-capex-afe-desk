                                      =If(locStep = 1, UpdateContext({ locTried1: true }); If(!IsBlank(drpNwAsset.Selected) && !IsBlank(drpNwType.Selected) && Len(Trim(txtNwTitle.Text)) >= 10 && !IsBlank(dteNwStart.SelectedDate) && dteNwEnd.SelectedDate > dteNwStart.SelectedDate, ClearCollect(colEst, {Code: "ENG", Name: "Engineering", Total: 0, Y1: 0, Y2: 0}, {Code: "MAT", Name: "Materials and equipment", Total: 0, Y1: 0, Y2: 0}, {Code: "FAB", Name: "Fabrication and construction", Total: 0, Y1: 0, Y2: 0}, {Code: "DRL", Name: "Drilling services", Total: 0, Y1: 0, Y2: 0}, {Code: "MAR", Name: "Marine and logistics", Total: 0, Y1: 0, Y2: 0}, {Code: "OWN", Name: "Owner's costs", Total: 0, Y1: 0, Y2: 0}, {Code: "CON", Name: "Contingency", Total: 0, Y1: 0, Y2: 0}); UpdateContext({ locStep: 2 })), locStep = 2, UpdateContext({ locTried2: true }); If(Coalesce(Sum(colEst, Total), 0) > 0 && CountRows(Filter(colEst, Abs(Y1 + Y2 - Total) > 0.005)) = 0, UpdateContext({ locStep: 3 })))
                                    Appearance: =ButtonAppearance.Primary
                                    AccessibleLabel: ="Next step"
                                    Visible: =!!IsBlank(gblParent) && locStep < 3
                                    Height: =nfSize.Touch
                                    FillPortions: =If(nfIsMobile, 1, 0)
                                    Width: =150
                              - btnNwSend:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="Submit"
                                    OnSelect: |-
                                      =IfError(UpdateContext({ locBusy: true });
                                      With({ no: With({ last: First(Sort(Filter(AFEs, StartsWith('AFE no', tcPrefix)), 'AFE no', SortOrder.Descending)).'AFE no' }, tcPrefix & Text(Coalesce(Value(Right(last, 3)), 0) + 1, "000")), me: User() },
                                        With({ a: Patch(AFEs, Defaults(AFEs), { 'AFE no': no, Kind: If(!IsBlank(gblParent), "Supplement", "Original"),
                                              Title: If(!IsBlank(gblParent), "Supplement to " & gblParent.'AFE no' & ": " & gblParent.Title, Trim(txtNwTitle.Text)),
                                              'Asset code': If(!IsBlank(gblParent), gblParent.'Asset code', drpNwAsset.Selected.'Asset code'), 'AFE type': If(!IsBlank(gblParent), gblParent.'AFE type', drpNwType.Selected.Value),
                                              'Parent AFE no': If(!IsBlank(gblParent), gblParent.'AFE no', Blank()), 'Amount (RM)': If(!IsBlank(gblParent), numNwSup.Value, Coalesce(Sum(colEst, Total), 0)),
                                              tsc_status: "Draft", 'Requester': me.FullName, 'Requester email': me.Email, Justification: Trim(txtNwWhy.Text),
                                              'Planned start': If(!IsBlank(gblParent), gblParent.'Planned start', dteNwStart.SelectedDate), 'Planned end': If(!IsBlank(gblParent), gblParent.'Planned end', dteNwEnd.SelectedDate),
                                              'Raised on': Today(), 'Submitted on': Today(), Source: "Live" }) },
                                          If(!IsBlank(gblParent),
                                            Patch('AFE lines', Defaults('AFE lines'), { Line: no & " CON", 'AFE no': no, 'Element code': "CON", 'Estimate (RM)': numNwSup.Value }),
                                            Collect('AFE lines', ForAll(Filter(colEst, Total > 0) As e, { Line: no & " " & e.Code, 'AFE no': no, 'Element code': e.Code, 'Estimate (RM)': e.Total }));
                                            Patch('AFE phasing', Defaults('AFE phasing'), { Phasing: no & " " & Year(dteNwStart.SelectedDate), 'AFE no': no, Year: Year(dteNwStart.SelectedDate), 'Planned (RM)': Coalesce(Sum(colEst, Y1), 0) });
                                            Patch('AFE phasing', Defaults('AFE phasing'), { Phasing: no & " " & Year(dteNwStart.SelectedDate) + 1, 'AFE no': no, Year: Year(dteNwStart.SelectedDate) + 1, 'Planned (RM)': Coalesce(Sum(colEst, Y2), 0) })
                                          );
                                          Set(gblSel, Patch(AFEs, a, { tsc_status: "Submitted" }));   // the Submitted row, not the Draft (E2E 24 Nov)
                                          UpdateContext({ locBusy: false }); Set(gblParent, Blank());
                                          Navigate(scrMine, ScreenTransition.None, { locToast: true, locToastKind: "Success", locToastMsg: no & " sent to the finance controller." })
                                        )
                                      ),
                                        UpdateContext({ locBusy: false, locToast: true, locToastKind: "Danger", locToastMsg: "Not sent. Check your connection and try again." }))
                                    Appearance: =ButtonAppearance.Primary
                                    AccessibleLabel: ="Submit the AFE"
                                    Visible: =!IsBlank(gblParent) || locStep = 3
                                    Height: =nfSize.Touch
                                    FillPortions: =If(nfIsMobile, 1, 0)
                                    Width: =150
                                    DisplayMode: =If(locBusy || !(Len(Trim(txtNwWhy.Text)) >= 20 && If(!IsBlank(gblParent), numNwSup.Value > 0 && !(!IsBlank(gblParent) && (gblParent.tsc_status = "Closed" || gblParent.tsc_status = "Rejected")), true)), DisplayMode.Disabled, DisplayMode.Edit)
                        - txtNwFoot:
                            Control: ModernText@1.0.0
